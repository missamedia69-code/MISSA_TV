# ─────────────────────────────────────────────────────────────────────────────
# MISSA TV — propriétés Gradle
# ─────────────────────────────────────────────────────────────────────────────

# Mémoire allouée au démon Gradle et encodage des sources.
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8

# Construction parallèle et cache de build.
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX obligatoire.
android.useAndroidX=true

# Les ressources R ne sont plus générées de façon transitive : builds plus
# rapides et code plus explicite.
android.nonTransitiveRClass=true

# Style de code officiel Kotlin.
kotlin.code.style=official

# Le catalogue de versions est vérifié à chaque build : une version inexistante
# ou une dépendance en conflit fait échouer le build immédiatement.
org.gradle.dependency.verification=lenient
