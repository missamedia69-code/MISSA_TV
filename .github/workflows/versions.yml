name: Sondage des dépendances (outil temporaire)

# ─────────────────────────────────────────────────────────────────────────────
# FICHIER TEMPORAIRE — à supprimer avant la livraison.
#
# But : déterminer, pour chaque bibliothèque du projet, la version minimale
# d'Android (minSdk) qu'elle déclare. Le projet cible minSdk 23 ; or les
# bibliothèques AndroidX relèvent régulièrement ce seuil et le build s'arrête
# alors sur une erreur de fusion de manifestes.
#
# Plutôt que de découvrir les incompatibilités une par une (un cycle de CI
# chacune), ce workflow interroge les archives AAR de plusieurs versions
# candidates et publie un tableau. Les versions retenues sont ensuite celles
# qui préservent minSdk 23.
# ─────────────────────────────────────────────────────────────────────────────
on:
  push:
    paths:
      - ".github/workflows/versions.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    name: Sondage minSdk
    runs-on: ubuntu-24.04
    steps:
      - name: Récupération du dépôt
        uses: actions/checkout@v5

      - name: Lecture du minSdk déclaré par chaque bibliothèque
        run: |
          set -uo pipefail
          exec > minSdk-report.txt 2>&1

          echo "==================== minSdk déclaré par les bibliothèques ===================="
          echo "Projet : minSdk 23"
          echo

          sonde() {
            local depot="$1" groupe="$2" artefact="$3" version="$4"
            local chemin
            chemin="$(echo "$groupe" | tr '.' '/')/$artefact/$version/$artefact-$version.aar"
            local temporaire
            temporaire="$(mktemp -d)"

            if ! curl -sSf --max-time 90 -o "$temporaire/a.aar" "$depot/$chemin" 2>/dev/null; then
              printf '%-66s %s\n' "$groupe:$artefact:$version" "AAR indisponible"
              rm -rf "$temporaire"
              return
            fi

            local manifeste
            manifeste="$(unzip -p "$temporaire/a.aar" AndroidManifest.xml 2>/dev/null | tr -d '\n' || true)"
            local minsdk=""
            if [[ -n "$manifeste" ]]; then
              minsdk="$(grep -oE 'minSdkVersion="?[0-9]+' <<<"$manifeste" | head -1 | grep -oE '[0-9]+' || true)"
            fi

            local verdict="?"
            if [[ -z "$minsdk" ]]; then
              verdict="non déclaré (hérite)"
            elif [[ "$minsdk" -le 23 ]]; then
              verdict="minSdk=${minsdk}  -> COMPATIBLE 23"
            else
              verdict="minSdk=${minsdk}  -> INCOMPATIBLE 23"
            fi
            printf '%-66s %s\n' "$groupe:$artefact:$version" "$verdict"
            rm -rf "$temporaire"
          }

          G="https://dl.google.com/dl/android/maven2"
          M="https://repo1.maven.org/maven2"

          echo "--- WorkManager (candidats) ---"
          for v in 2.12.0 2.11.2 2.10.1 2.10.0 2.9.1 2.9.0; do
            sonde "$G" androidx.work work-runtime-ktx "$v"
          done

          echo
          echo "--- Autres bibliothèques actuellement retenues ---"
          sonde "$G" androidx.room room-runtime 2.8.5
          sonde "$G" androidx.media3 media3-exoplayer 1.11.1
          sonde "$G" androidx.media3 media3-ui 1.11.1
          sonde "$G" androidx.media3 media3-session 1.11.1
          sonde "$G" androidx.lifecycle lifecycle-runtime-ktx 2.11.0
          sonde "$G" androidx.lifecycle lifecycle-viewmodel-compose 2.11.0
          sonde "$G" androidx.activity activity-compose 1.13.0
          sonde "$G" androidx.core core-ktx 1.19.1
          sonde "$G" androidx.datastore datastore-preferences 1.2.1
          sonde "$G" androidx.security security-crypto 1.1.0
          sonde "$G" androidx.hilt hilt-work 1.4.0
          sonde "$G" androidx.tv tv-material 1.1.0
          sonde "$G" androidx.tv tv-foundation 1.0.0
          sonde "$G" com.google.dagger hilt-android 2.60.1
          sonde "$M" com.google.crypto.tink tink-android 1.23.0

          echo
          echo "==================== fin ===================="

      - name: Publication du rapport dans la branche
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f minSdk-report.txt
          if git diff --cached --quiet; then
            echo "Rapport inchangé."
          else
            git commit -m "chore(ci): sondage des minSdk (temporaire) [skip ci]"
            git push
          fi
