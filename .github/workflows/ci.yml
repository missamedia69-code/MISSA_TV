name: CI

# ─────────────────────────────────────────────────────────────────────────────
# Intégration continue : hygiène du dépôt, validation de la configuration
# distante, puis analyse statique / tests / compilation de l'application.
#
# Le runner est figé sur ubuntu-24.04 : « ubuntu-latest » bascule vers Ubuntu 26
# à partir du 19 octobre 2026, ce qui rendrait les builds non reproductibles.
# ─────────────────────────────────────────────────────────────────────────────
on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
      - "arena/**"
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GRADLE_OPTS: >-
    -Dorg.gradle.jvmargs=-Xmx3g -Dorg.gradle.daemon=false -Dfile.encoding=UTF-8

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # 1. Hygiène : aucun identifiant ne doit être versionné.
  # ───────────────────────────────────────────────────────────────────────────
  hygiene:
    name: Hygiène / secrets
    runs-on: ubuntu-24.04
    steps:
      - name: Récupération du dépôt
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Détection de secrets
        run: |
          chmod +x scripts/check-secrets.sh
          ./scripts/check-secrets.sh

  # ───────────────────────────────────────────────────────────────────────────
  # 2. Validation de la configuration distante (schéma + cohérence).
  # ───────────────────────────────────────────────────────────────────────────
  config:
    name: Configuration distante
    runs-on: ubuntu-24.04
    steps:
      - name: Récupération du dépôt
        uses: actions/checkout@v5

      - name: Configuration de Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Installation du validateur de schéma
        run: pip install --quiet jsonschema

      - name: Validation de portal-config.json
        run: python3 scripts/validate-config.py

  # ───────────────────────────────────────────────────────────────────────────
  # 3. Analyse statique, tests et compilation.
  # ───────────────────────────────────────────────────────────────────────────
  android:
    name: Build / lint / tests
    runs-on: ubuntu-24.04
    needs: [hygiene]
    # TEMPORAIRE : permet de publier le rapport de compilation dans la branche
    # (le journal de la CI n'est pas exploitable depuis l'environnement de
    # développement). À retirer avant la livraison.
    permissions:
      contents: write
    steps:
      - name: Récupération du dépôt
        uses: actions/checkout@v5

      - name: Configuration du JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # Le SDK Android est déjà présent sur les runners GitHub ; on installe
      # seulement les composants exigés par AGP 9.4, sans dépendre d'une action
      # tierce (android-actions/setup-android@v3 est obsolète et échoue).
      - name: Installation des composants du SDK Android
        run: |
          set -uo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "SDK détecté : $SDK"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" > local.properties.tmp
          echo "sdk.dir=$SDK" >> local.properties.tmp
          mv local.properties.tmp local.properties

          SDKMANAGER="$(find "$SDK" -path '*/cmdline-tools/*/bin/sdkmanager' 2>/dev/null | head -1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager introuvable dans $SDK"
            find "$SDK" -maxdepth 3 -type d | head -30
            exit 1
          fi
          echo "sdkmanager : $SDKMANAGER"

          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-37" \
            "build-tools;36.0.0" \
            2>&1 | tail -5 || true

          echo "--- Plateformes disponibles ---"
          ls "$SDK/platforms" 2>/dev/null || echo "(aucune)"
          echo "--- Build-tools disponibles ---"
          ls "$SDK/build-tools" 2>/dev/null || echo "(aucun)"

      - name: Configuration de Gradle (cache)
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Permissions du wrapper
        run: chmod +x ./gradlew

      - name: Analyse statique, tests, lint et compilation
        id: gradle
        continue-on-error: true
        run: |
          set -uo pipefail
          ./gradlew ktlintCheck testDebugUnitTest lintDebug assembleDebug \
            --stacktrace --no-daemon > build-output.txt 2>&1
          CODE=$?
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          # Extrait utile au diagnostic : la fin du journal.
          tail -c 40000 build-output.txt > build-report.txt
          exit "$CODE"

      # TEMPORAIRE — diagnostic à distance.
      # Le journal d'exécution de la CI n'est pas accessible depuis
      # l'environnement de développement : en cas d'échec, la fin du journal est
      # donc publiée dans la branche pour pouvoir être lue puis corrigée.
      # Cette étape et le fichier build-report.txt seront supprimés avant la
      # livraison.
      - name: Publication du rapport en cas d'échec
        if: failure()
        run: |
          set -uo pipefail
          {
            echo "# Rapport de compilation"
            echo
            echo "Commit : ${{ github.sha }}"
            echo
            echo '```'
            cat build-report.txt 2>/dev/null || echo "(rapport indisponible)"
            echo '```'
          } > build-report.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f build-report.txt
          git commit -m "chore(ci): rapport de compilation (temporaire) [skip ci]" || exit 0
          git push || true

      - name: Publication des rapports de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapports-tests
          path: |
            **/build/reports/tests/**
            **/build/reports/ktlint/**
            **/build/reports/lint-results-*.html
          if-no-files-found: ignore
          retention-days: 7
