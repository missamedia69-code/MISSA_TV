name: CI

# ─────────────────────────────────────────────────────────────────────────────
# Intégration continue : hygiène du dépôt, validation de la configuration
# distante, puis build / lint / tests de l'application Android.
# ─────────────────────────────────────────────────────────────────────────────
on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
      - "arena/**"
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

# Une seule exécution par branche : les pushs successifs annulent les
# exécutions précédentes devenues obsolètes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx3g -Dorg.gradle.daemon=false -Dfile.encoding=UTF-8"

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # 1. Hygiène : aucun secret ne doit être versionné.
  # ───────────────────────────────────────────────────────────────────────────
  hygiene:
    name: Hygiène / secrets
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du dépôt
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Détection de secrets
        run: |
          chmod +x scripts/check-secrets.sh
          ./scripts/check-secrets.sh

  # ───────────────────────────────────────────────────────────────────────────
  # 2. Validation de la configuration distante (schéma + cohérence).
  # ───────────────────────────────────────────────────────────────────────────
  config:
    name: Configuration distante
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du dépôt
        uses: actions/checkout@v4

      - name: Configuration de Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installation du validateur de schéma
        run: pip install --quiet jsonschema

      - name: Validation de portal-config.json
        run: |
          python3 - <<'PY'
          import json, sys
          from pathlib import Path
          from jsonschema import validate, ValidationError

          root = Path("remote-config")
          schema = json.loads((root / "portal-config.schema.json").read_text())
          config = json.loads((root / "portal-config.json").read_text())

          try:
              validate(instance=config, schema=schema)
          except ValidationError as exc:
              print(f"✗ portal-config.json invalide : {exc.message}")
              print(f"  chemin : {'/'.join(str(p) for p in exc.absolute_path)}")
              sys.exit(1)

          print("✓ portal-config.json conforme au schéma")

          # Contrôles supplémentaires que le schéma ne peut pas exprimer.
          ids = [p["id"] for p in config.get("profiles", [])]
          if len(ids) != len(set(ids)):
              print("✗ Identifiants de profil dupliqués")
              sys.exit(1)

          default = config.get("defaultProfileId")
          if default is not None and default not in ids:
              print(f"✗ defaultProfileId « {default} » absent des profils")
              sys.exit(1)

          print(f"✓ {len(ids)} profil(s), defaultProfileId={default}")
          PY

  # ───────────────────────────────────────────────────────────────────────────
  # 3. Build, lint, analyse statique et tests unitaires.
  #    (Actif dès que le wrapper Gradle est présent.)
  # ───────────────────────────────────────────────────────────────────────────
  android:
    name: Build / lint / tests
    runs-on: ubuntu-latest
    needs: [hygiene]
    steps:
      - name: Récupération du dépôt
        uses: actions/checkout@v4

      # La fonction hashFiles() n'est pas disponible dans un « if » de job :
      # on détecte donc le wrapper dans une étape dédiée, puis on conditionne
      # les étapes suivantes à sa présence.
      - name: Détection du wrapper Gradle
        id: wrapper
        run: |
          if [ -f ./gradlew ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Wrapper Gradle absent — compilation ignorée pour l'instant."
          fi

      - name: Configuration du JDK 17
        if: steps.wrapper.outputs.present == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configuration du SDK Android
        if: steps.wrapper.outputs.present == 'true'
        uses: android-actions/setup-android@v3

      - name: Configuration de Gradle (cache)
        if: steps.wrapper.outputs.present == 'true'
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Permissions du wrapper
        if: steps.wrapper.outputs.present == 'true'
        run: chmod +x ./gradlew

      - name: Analyse statique (ktlint + detekt)
        if: steps.wrapper.outputs.present == 'true'
        run: ./gradlew ktlintCheck detekt --stacktrace

      - name: Tests unitaires
        if: steps.wrapper.outputs.present == 'true'
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Lint Android
        if: steps.wrapper.outputs.present == 'true'
        run: ./gradlew lintDebug --stacktrace

      - name: Assemblage du debug
        if: steps.wrapper.outputs.present == 'true'
        run: ./gradlew assembleDebug --stacktrace

      - name: Publication des rapports de tests
        if: always() && steps.wrapper.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: rapports-tests
          path: |
            **/build/reports/tests/**
            **/build/reports/ktlint/**
            **/build/reports/detekt/**
            **/build/reports/lint-results-*.html
          if-no-files-found: ignore
          retention-days: 7
