# ─────────────────────────────────────────────────────────────────────────────
# Wrapper Gradle — MISSA TV
#
# La distribution est volontairement figée (pas de « latest ») afin que tous
# les postes et la CI compilent avec exactement la même version de Gradle.
#
# Gradle 9.8.0 est requis au minimum par AGP 9.4 (minimum imposé : 9.6.0).
# ─────────────────────────────────────────────────────────────────────────────
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-9.8.0-bin.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
