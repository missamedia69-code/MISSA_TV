# ─────────────────────────────────────────────────────────────────────────────
# MISSA TV — catalogue de versions
#
# Toutes les versions ci-dessous ont été vérifiées comme réellement publiées
# (Google Maven / Maven Central / portail de plugins Gradle) avant d'être
# figées ici. Aucune plage de versions ni version dynamique : les builds sont
# reproductibles.
#
# Contraintes imposées par AGP 9 :
#   - Gradle >= 9.6.0         (voir gradle/wrapper/gradle-wrapper.properties)
#   - JDK 17
#   - KSP  >= 2.3.6
#   - Hilt >= 2.59.2
#   - le plugin « org.jetbrains.kotlin.android » ne doit PAS être appliqué
#     (AGP 9 fournit Kotlin nativement : « built-in Kotlin »)
# ─────────────────────────────────────────────────────────────────────────────

[versions]
# Chaîne de compilation
agp = "9.4.1"
kotlin = "2.4.20"
ksp = "2.3.12"

# Injection de dépendances
hilt = "2.60.1"
hiltExt = "1.4.0"

# Interface
composeBom = "2026.09.00"
coreKtx = "1.19.1"
activityCompose = "1.13.0"
lifecycle = "2.11.0"
tvMaterial = "1.1.0"
tvFoundation = "1.0.0"

# Lecture vidéo
media3 = "1.11.1"

# Données
room = "2.8.5"
datastore = "1.2.1"
# WorkManager 2.12.0 exige minSdk 24 : la 2.11.2 est la dernière compatible
# avec le minSdk 23 du projet (sondage des archives AAR, voir docs/ARCHITECTURE.md).
work = "2.11.2"
securityCrypto = "1.1.0"
tink = "1.23.0"

# Réseau
retrofit = "3.0.0"
okhttp = "5.5.0"
serialization = "1.11.0"
coroutines = "1.11.0"

# Images
coil = "3.6.3"

# Qualité
ktlintPlugin = "14.2.0"
ktlintTool = "1.8.0"

[libraries]
# --- AndroidX de base --------------------------------------------------------
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }

# --- Compose (versions gérées par la BOM) ------------------------------------
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-material-icons-extended = { module = "androidx.compose.material:material-icons-extended" }

# Remarque : androidx.navigation (et androidx.hilt:hilt-navigation-compose qui en
# dépend) exige minSdk 24. Le projet cible minSdk 23 pour rester installable sur
# les boîtiers Android TV anciens : la navigation est donc écrite à la main
# (ui/navigation) et les ViewModels sont fournis par des fabriques Hilt
# explicites (core/ui/ViewModelFactory.kt). Voir docs/ARCHITECTURE.md.

# --- Android TV ---------------------------------------------------------------
androidx-tv-material = { module = "androidx.tv:tv-material", version.ref = "tvMaterial" }
androidx-tv-foundation = { module = "androidx.tv:tv-foundation", version.ref = "tvFoundation" }

# --- Media3 -------------------------------------------------------------------
media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
media3-exoplayer-hls = { module = "androidx.media3:media3-exoplayer-hls", version.ref = "media3" }
media3-exoplayer-dash = { module = "androidx.media3:media3-exoplayer-dash", version.ref = "media3" }
media3-ui = { module = "androidx.media3:media3-ui", version.ref = "media3" }
media3-session = { module = "androidx.media3:media3-session", version.ref = "media3" }
media3-datasource-okhttp = { module = "androidx.media3:media3-datasource-okhttp", version.ref = "media3" }

# --- Injection ---------------------------------------------------------------
hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-compiler = { module = "com.google.dagger:hilt-compiler", version.ref = "hilt" }
androidx-hilt-work = { module = "androidx.hilt:hilt-work", version.ref = "hiltExt" }

# --- Persistance -------------------------------------------------------------
room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
androidx-security-crypto = { module = "androidx.security:security-crypto", version.ref = "securityCrypto" }
tink-android = { module = "com.google.crypto.tink:tink-android", version.ref = "tink" }
work-runtime-ktx = { module = "androidx.work:work-runtime-ktx", version.ref = "work" }

# --- Réseau ------------------------------------------------------------------
retrofit = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit" }
retrofit-serialization = { module = "com.squareup.retrofit2:converter-kotlinx-serialization", version.ref = "retrofit" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-logging = { module = "com.squareup.okhttp3:logging-interceptor", version.ref = "okhttp" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }

# --- Images ------------------------------------------------------------------
coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
coil-network-okhttp = { module = "io.coil-kt.coil3:coil-network-okhttp", version.ref = "coil" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlintPlugin" }
